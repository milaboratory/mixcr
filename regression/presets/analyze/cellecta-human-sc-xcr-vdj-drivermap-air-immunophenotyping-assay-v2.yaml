flags: []
pipeline:
  - align
  - refineTagsAndSort
  - assemble
  - assembleCells
  - exportClones
  - exportCloneGroups
align:
  species: hsa
  libraryName: default
  trimmingQualityThreshold: 10
  trimmingWindowSize: 6
  chains: ALL
  replaceWildcards: true
  overlapPairedReads: true
  bamDropNonVDJ: false
  writeFailedAlignments: false
  tagPattern: "^(R1:*)\\^(CELL:N{10})(MIVBC:GCATCA)(R2:*)|^(CELL:N{10})(MIVBC:AGTCGT)(R2:*)|^(CELL:N{10})(MIVBC:TCGCAT)(R2:*)|^(CELL:N{10})(MIVBC:AGCGTA)(R2:*)"
  tagUnstranded: false
  tagMaxBudget: 10.0
  headerExtractors: []
  readIdAsCellTag: false
  tagTransformationSteps:
    - type: mapTags
      name: MIVBC to BC
      matchTags:
        - MIVBC
      newTags:
        - MIBC
      allowOneMismatch: true
      rules:
        - from: AGCGTA
          to: BC4
        - from: AGTCGT
          to: BC2
        - from: GCATCA
          to: BC1
        - from: TCGCAT
          to: BC3
      reportingLevel: VerboseReport
    - type: mapTags
      name: CELL to CELLWELL
      matchTags:
        - CELL
      newTags:
        - CELLWELL
      allowOneMismatch: true
      rules:
        - from: AACATACCTA
          to: G9
        - from: AACGTTACAT
          to: D5
        - from: AAGCAGATAT
          to: H2
        - from: AAGTCTTGTA
          to: F5
