shotgun-base:
  category: generic
  inheritFrom: bundle-base
  abstract: true
  flags:
    - species
    - materialType
    - assembleContigsByOrMaxLength
  pipeline:
    - align
    - assemblePartial
    - extend
    - assemble
    - assembleContigs
    - exportClones
  qc:
    checks:
      - type: AlignmentsDroppedLowQuality
        middle: 0.1
        upper: 0.2
  align:
    inheritFrom: align-shotgun
  assemblePartial:
    inheritFrom: assemblePartial-base
    overrides:
      repeats: 2
  assemble:
    inheritFrom: assemble-base
    overrides:
      clnaOutput: true
      cloneAssemblerParameters:
        assemblingFeatures:
          - CDR3
        cloneFactoryParameters:
          vParameters:
            relativeMinScore: 0.8
            maxHits: 5
            scoring:
              type: affine
              alphabet: nucleotide
              subsMatrix: "simple(match = 10, mismatch = -19)"
              gapOpenPenalty: -62
              gapExtensionPenalty: -11
            maxAlignmentWidthLinear: 5
            maxAlignmentWidthAffine: 500
          jParameters:
            relativeMinScore: 0.97
            maxHits: 5
            scoring:
              type: affine
              alphabet: nucleotide
              subsMatrix: "simple(match = 10, mismatch = -19)"
              gapOpenPenalty: -62
              gapExtensionPenalty: -11
            maxAlignmentWidthLinear: 5
            maxAlignmentWidthAffine: 500
          cParameters:
            relativeMinScore: 0.97
            maxHits: 5
            scoring:
              type: linear
              alphabet: nucleotide
              subsMatrix: "simple(match = 5, mismatch = -9)"
              gapPenalty: -12
            maxAlignmentWidthLinear: 5
            maxAlignmentWidthAffine: 500
          dParameters:
            relativeMinScore: 0.85
            absoluteMinScore: 25.0
            maxHits: 3
            scoring:
              type: linear
              alphabet: nucleotide
              subsMatrix: "simple(match = 5, mismatch = -9)"
              gapPenalty: -12

rna-seq:
  label: "RNA-Seq data"
  category: generic
  inheritFrom: shotgun-base
  flags:
    - species
  mixins:
    - type: MaterialTypeRNA
    - type: AssembleContigsWithMaxLength

exome-seq:
  label: "Exome-Seq data"
  category: generic
  inheritFrom: shotgun-base
  flags:
    - species
  mixins:
    - type: MaterialTypeDNA
    - type: AssembleContigsWithMaxLength

rna-seq-with-umi:
  label: "RNA-Seq data with UMI"
  category: generic
  inheritFrom: generic-amplicon-with-umi
  mixins:
    - type: AddPipelineStep
      step: mitool-parse
    - type: AddPipelineStep
      step: mitool-refine-tags
    - type: AddPipelineStep
      step: mitool-consensus
    - type: LeftAlignmentBoundaryNoPoint
      floating: false
    - type: RightAlignmentBoundaryNoPoint
      floating: true
      geneType: C
    - type: SetClonotypeAssemblingFeatures
      features: [ "VDJRegion" ]
    - type: MaterialTypeRNA
  flags:
    - species
    - tagPattern
  mitool:
    parse:
      inheritFrom: mitool-parse-default
    refineTags:
      inheritFrom: mitool-refineTags-default
      overrides:
        tagTypes:
          - Molecule
    consensus:
      inheritFrom: mitool-consensus-2-steps
      overrides:
        - groupingTagTypes:
            - Molecule
          payloadTagTypes:
            - Targets
          parameters:
            aAssemblerParameters:
              minAlignmentScore: 10
              maxNormalizedAlignmentPenalty: 0.16
            positiveMinQualityShare: 0.13
            positiveMinIntersectionQuality: 50
            minRecordSharePerConsensus: 0.1
            minRecordsPerConsensus: 0
        - groupingTagTypes:
            - Molecule
          payloadTagTypes:
            - Targets
          parameters:
            aAssemblerParameters:
              minAlignmentScore: 20
              maxNormalizedAlignmentPenalty: 0.51
            positiveMinQualityShare: 0.11
            positiveMinIntersectionQuality: 50
            minRecordSharePerConsensus: 0.1
            minRecordsPerConsensus: 0
  align:
    inheritFrom: align-amplicon
    overrides:
      trimmingQualityThreshold: 0
      parameters:
        readsLayout: ReverseOnly
        vParameters:
          relativeMinScore: 0.7
          parameters:
            mapperRelativeMinScore: 0.7
            relativeMinScore: 0.7
  refineTagsAndSort:
    runCorrection: false
    parameters:
      correctionPower: 0.001
      backgroundSubstitutionRate: 0.001
      backgroundIndelRate: 1.0e-05
      minQuality: 12
      maxSubstitutions: 2
      maxIndels: 2
      maxTotalErrors: 3
      postFilter: null
  assemble:
    inheritFrom: assemble-with-consensus-base
    overrides:
      clnaOutput: true
      cloneAssemblerParameters:
        assemblingFeatures:
          - VDJRegion
        badQualityThreshold: 0
        minimalQuality: 0
        postFilters: null
  exportClones:
    inheritFrom: exportClones-umi-base


