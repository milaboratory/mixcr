"bruker-sc-xcr-vdj-beacon":
  vendor: "Bruker"
  label: "Single cell VDJ"
  category: non-generic
  inheritFrom: generic-lt-single-cell-amplicon
  flags:
    - species
  mixins:
    - type: SetTagPattern
      tagPattern: ^(CELL:N{10})ggg\^(R2:*)
    - type: AddPipelineStep
      step: mitool-parse
    - type: AddPipelineStep
      step: mitool-refine-tags
    - type: AddPipelineStep
      step: mitool-consensus
    - type: SetClonotypeAssemblingFeatures
      features: [ "VDJRegion" ]
    - type: LeftAlignmentBoundaryNoPoint
      floating: true
    - type: RightAlignmentBoundaryNoPoint
      floating: true
      geneType: C
  mitool:
    parse:
      inheritFrom: mitool-parse-default
      overrides:
        trimmingQualityThreshold: 20
        trimmingWindowSize: 5
    refineTags:
      inheritFrom: mitool-refineTags-default
      overrides:
        tagTypes:
          - Cell
        whitelists:
          CELL:
            - TGGTAGGCTG
            - GTTAGCTGCT
            - TACATAAAGA
            - AGCCCTATCA
            - ACCTACCGCC
            - TCTCCAAGAC
            - GTATACATTA
            - AGACTCGATT
            - CCAGGATTAA
            - CTCCTTCAAG
            - ACTACTTCTG
            - GCCTTGTTGT
    consensus:
      groupingTagTypes:
        - Cell
      payloadTagTypes:
        - Targets
      parameters:
        aAssemblerParameters:
          bandWidth: 4
          scoring:
            type: linear
            alphabet: nucleotide
            subsMatrix: "simple(match = 5, mismatch = -10)"
            gapPenalty: -19
          minAlignmentScore: 62
          maxNormalizedAlignmentPenalty: 0.4
          trimMinimalSumQuality: 0
          trimReferenceRegion: true
          maxQuality: 45
        kMapParameters:
          k: 9
          useQ1Score: true
          coreSequenceKMers: 20
          coreSequenceRecordScore: 20
          neighbourhoodSize: 2
        positiveMinQualityShare: 0.21
        positiveMinIntersectionQuality: 238
        minAlignmentScoreForDiscardRecord: 0
        maxNormalizedAlignmentPenaltyForDiscardRecord: 0.0
        minRecordSharePerConsensus: 0.01
        minRecordsPerConsensus: 0
        useWeightsForRecordsPerConsensus: false
        minRecordWeightForUse: 0
        maxIterationsPerConsensus: 90
        maxConsensuses: 0
  align:
    inheritFrom: align-single-cell
    overrides:
      trimmingQualityThreshold: 0
      parameters:
        readsLayout: ReverseOnly
        vParameters:
          relativeMinScore: 0.7
          parameters:
            mapperRelativeMinScore: 0.7
            relativeMinScore: 0.7
      tagTransformationSteps:
        - type: mapTags
          name: "CELL to Bruker Barcode"
          matchTags:
            - CELL
          newTags:
            - CELLBARCODE
          allowOneMismatch: true
          rules:
            - from: TGGTAGGCTG
              to: C0D0F1T0
            - from: GTTAGCTGCT
              to: C0D1F1T0
            - from: TACATAAAGA
              to: C0D0F0T1
            - from: AGCCCTATCA
              to: C0D1F0T0
            - from: ACCTACCGCC
              to: C1D1F0T0
            - from: TCTCCAAGAC
              to: C0D0F1T1
            - from: GTATACATTA
              to: C1D0F0T0
            - from: AGACTCGATT
              to: C0D1F0T1
            - from: CCAGGATTAA
              to: C0D1F1T1
            - from: CTCCTTCAAG
              to: C1D0F0T1
            - from: ACTACTTCTG
              to: C1D0F1T0
            - from: GCCTTGTTGT
              to: C1D1F1T1
          reportingLevel: VerboseReport
  refineTagsAndSort:
    runCorrection: false
    parameters:
      correctionPower: 0.001
      backgroundSubstitutionRate: 0.001
      backgroundIndelRate: 1.0e-05
      minQuality: 12
      maxSubstitutions: 2
      maxIndels: 2
      maxTotalErrors: 3
      postFilter: null
  assemble:
    inheritFrom: assemble-with-consensus-sc-cell-level-fr
    overrides:
      clnaOutput: false
      cloneAssemblerParameters:
        badQualityThreshold: 0
        minimalQuality: 0
        cloneFactoryParameters:
          vParameters:
            maxAlignmentWidthLinear: 5
            maxAlignmentWidthAffine: 500
            relativeMinScore: 0.97
            scoring: null
          jParameters:
            maxAlignmentWidthLinear: 5
            maxAlignmentWidthAffine: 500
            relativeMinScore:
            scoring: null
          dParameters:
            absoluteMinScore:
            relativeMinScore:
            maxHits:
            scoring: null
          cParameters:
            maxAlignmentWidthLinear: 5
            maxAlignmentWidthAffine: 500
            relativeMinScore:
            scoring: null
        postFilters:
           - type: filter_in_groups
             isolationKeys:
               - geneLabel:ReliableChain
               - allTags:Cell
             nestedFilter:
               type: filter_groups
               groupingKeys:
                 - clone
                 predicates:
                   - metrics:
                     - type: group_metric_sum_weight
                       reportHist: null
                     operator:
                       type: group_operator_cumtop
                       share: 0.9
             aggregateReport: true
  exportClones:
    inheritFrom: exportClones-single-cell-no-umi-base
    overrides:
      fields:
        - field: "-cloneId"
        - field: "-cellGroup"
        - field: "-tags"
          args: [ "Cell" ]
        - field: "-readCount"
        - field: "-readFraction"
        - field: "-targetSequences"
        - field: "-targetQualities"
        - field: "-vHit"
        - field: "-dHit"
        - field: "-jHit"
        - field: "-cHit"
        - field: "-vAlignment"
        - field: "-dAlignment"
        - field: "-jAlignment"
        - field: "-cAlignment"
        - field: "-allNFeaturesWithMinQuality"
        - field: "-nFeature"
          args: [ "VDJRegion" ]
        - field: "-aaFeature"
          args: [ "VDJRegion" ]
        - field: "-defaultAnchorPoints"
        - field: "-topChains"