generic-amplicon:
  label: "Generic amplicon"
  category: generic
  inheritFrom: bundle-base
  flags:
    - species
    - materialType
    - leftAlignmentMode
    - rightAlignmentMode
    - assembleClonesBy
  pipeline:
    - align
    - assemble
    - exportClones
  align:
    inheritFrom: align-amplicon
  qc:
    checks:
      - type: SuccessfullyAlignedReads
        middle: 0.6
        upper: 0.8
      - type: OffTargetReads
        middle: 0.2
        upper: 0.4
      - type: ReadsWithNoVOrJHits
        middle: 0.2
        upper: 0.4
      - type: ReadsUsedInClonotypes
        middle: 0.5
        upper: 0.7
      - type: AlignmentsWithNoAssemblingFeature
        middle: 0.2
        upper: 0.3
      - type: AlignmentsDroppedLowQuality
        middle: 0.05
        upper: 0.15
      - type: ClonesDroppedInPostFiltering
        middle: 0.05
        upper: 0.15
      - type: AlignmentsDroppedInPostFiltering
        middle: 0.05
        upper: 0.15

generic-amplicon-with-umi:
  label: "Generic amplicon with UMI barcodes"
  category: generic
  mixins:
    - type: AddTagsValidation
      validation:
        type: MustContainTagType
        tagType: Molecule
  inheritFrom: bundle-base
  flags:
    - species
    - materialType
    - leftAlignmentMode
    - rightAlignmentMode
    - tagPattern
    - assembleClonesBy
  pipeline:
    - align
    - refineTagsAndSort
    - assemble
    - exportClones
  align:
    inheritFrom: align-amplicon
  refineTagsAndSort:
    inheritFrom: refineTagsAndSort-amplicon-umi-base
  assemble:
    inheritFrom: assemble-with-consensus-base
  exportClones:
    inheritFrom: exportClones-umi-base
  exportAlignments:
    inheritFrom: exportAlignments-umi-base
  qc:
    checks:
      - type: SuccessfullyAlignedReads
        middle: 0.6
        upper: 0.8
      - type: OffTargetReads
        middle: 0.2
        upper: 0.4
      - type: ReadsWithNoVOrJHits
        middle: 0.2
        upper: 0.4
      - type: AlignmentsWithNoAssemblingFeature
        middle: 0.15
        upper: 0.3
      - type: ReadsWithNoBarcode
        middle: 0.2
        upper: 0.4
      - type: ReadsDroppedInTagRefinement
        middle: 0.15
        upper: 0.25
      - type: ReadsDroppedInTagCorrection
        tag: UMI
        middle: 0.15
        upper: 0.25
      - type: ReadsDroppedInTagFiltering
        middle: 0.15
        upper: 0.25
      - type: TagGroupsWithNoAssemblingFeature
        middle: 0.2
        upper: 0.4
      - type: TagGroupsWithMultipleConsensuses
        middle: 0.05
        upper: 0.2
      - type: UnassignedAlignments
        middle: 0.15
        upper: 0.25
      - type: ReadsUsedInClonotypes
        middle: 0.5
        upper: 0.7
      - type: AlignmentsDroppedLowQuality
        middle: 0.05
        upper: 0.15
      - type: ClonesDroppedInPostFiltering
        middle: 0.05
        upper: 0.15
      - type: AlignmentsDroppedInPostFiltering
        middle: 0.05
        upper: 0.15
