miltenyi-human-rna-tcr-profiling:
  vendor: "Miltenyi"
  label: "Human TCR α/β RNA Profiling Kit"
  category: non-generic
  inheritFrom: generic-amplicon-with-umi
  defaultChains:
    - TCRAlpha
    - TCRBeta
  mixins:
    - type: SetSpecies
      species: hsa
    - type: MaterialTypeRNA
    - type: SetTagPattern
      tagPattern: ^N{0:2}tggtatcaacgcagagt(UMI:N{14})N{21}(R1:*) \ ^N{20}(R2:*)
    - type: LeftAlignmentBoundaryNoPoint
      floating: false
    - type: RightAlignmentBoundaryNoPoint
      floating: false
      geneType: C
    - type: SetSplitClonesBy
      geneType: V
      value: true
    - type: SetSplitClonesBy
      geneType: J
      value: true
    - type: SetClonotypeAssemblingFeatures
      features: [ "CDR3" ]
    - type: AddQcChecks
      args:
        - type: OverlappedReadsMoreBetter
          middle: 0.6
          upper: 0.7
  align:
    inheritFrom: generic-amplicon-with-umi
    overrides:
      parameters:
        readsLayout: ReverseOnly
  refineTagsAndSort:
    inheritFrom: refineTagsAndSort-amplicon-umi-base
    overrides:
      parameters:
        postFilter:
          type: filter_groups
          groupingKeys:
            - UMI
          predicates:
            - metrics:
                - type: "group_metric_sum_weight"
                  reportHist:
                    log: true
                    binNumber: 0
                    minBinWidth: 0.2
              operator:
                type: group_operator_lowest_threshold
                operators:
                  - type: group_operator_advanced_thresholding
                    algo:
                      type: otsu
                    histTransformers:
                      - type: inflate
                        fraction: 0.15
                    logX: true
                    minimalSample: 20
                    fallbackThreshold: 1.0
                  - type: group_operator_cumtop
                    share: 0.85
                    round: Down

miltenyi-human-rna-tcr-profiling-multiplex:
  vendor: "Miltenyi"
  label: "Human TCR α/β RNA Profiling Kit (Multiplex)"
  category: non-generic
  inheritFrom: miltenyi-human-rna-tcr-profiling
  defaultChains:
    - TCRAlpha
    - TCRBeta
  mixins:
    - type: SetTagPattern
      tagPattern: ^N{0:12}tggtatcaacgcagagt(SMPL:N{5})(UMI:N{14})N{21}(R1:)\^N{20}(R2:)