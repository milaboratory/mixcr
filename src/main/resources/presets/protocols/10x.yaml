  refineTagsAndSort:
    runCorrection: true
    parameters:
      correctionPower: 0.001
      backgroundSubstitutionRate: 0.01
      backgroundIndelRate: 0.001
      minQuality: 0
      maxSubstitutions: 3
      maxIndels: 2
      maxTotalErrors: 4
      postFilter:
        type: filter_and
        operands:
          - type: filter_groups
            groupingKeys:
              - allTags:Cell
            predicates:
              - metrics:
                  - type: "group_metric_nunique"
                    reportHist:
                      log: true
                      binNumber: 0
                      minBinWidth: 0.2
                    keys:
                      - allTags:Molecule
                operator:
                  type: group_operator_advanced_thresholding
                  algo:
                    type: otsu
                  histTransformers:
                    - type: inflate
                      fraction: 0.15
                  logX: true
                  minimalSample: 20
                  fallbackThreshold: 1.0
          - type: filter_groups
            groupingKeys:
              - allTags:Cell
              - allTags:Molecule
            predicates:
              - metrics:
                  - type: group_metric_kmer_diversity
                    sequences:
                      - targets
                    k: 12
                    minimalQuality: 20
                    topShare: 0.5
                    minSequenceCount: 4
                    reportHist:
                      binNumber: 0
                      minBinWidth: 6
                operator:
                  type: group_operator_range
                  lower: 150.0
                  acceptNaN: true
  assemble:
    inheritFrom: assemble-with-consensus-sc-cell-level-fr
    overrides:
      clnaOutput: true
      cloneAssemblerParameters:
        assemblingFeatures:
          - CDR3
        badQualityThreshold: 0
        minimalQuality: 0
        postFilters:
          - type: filter_in_groups
            isolationKeys:
              - clone
            nestedFilter:
              type: filter_groups
              groupingKeys:
                - allTags:Cell
              predicates:
                - metrics:
                    - type: group_metric_sum_weight
                      reportHist:
                        log: true
                        binNumber: 0
                        minBinWidth: 0.1
                  operator:
                    type: group_operator_cumtop
                    share: 0.99
            aggregateReport: true
  assembleContigs:
    inheritFrom: assembleContigs-sc-fr
    overrides:
      parameters:
        useOnlyFullAlignments:
          cumtop: 0.95
          fallbackToTopAlignment: true
  exportClones:
    inheritFrom: exportClones-single-cell-with-umi-base
  exportAlignments:
    inheritFrom: exportAlignments-single-cell-with-umi-base

