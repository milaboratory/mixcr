          name: "Visium HD spatial barcode"
          destinationTag: CELL
          transformation:
            type: concatenate
            sources:
              - type: constantString
                value: "s_002um_"
              - type: tag
                name: CELL2ROW
              - type: constantString
                value: "_"
              - type: tag
                name: CELL1COL
              - type: constantString
                value: "-1"
      parameters:
        readsLayout: ReverseOnly
        vParameters:
          relativeMinScore: 0.7
          parameters:
            mapperRelativeMinScore: 0.7
            relativeMinScore: 0.7
  refineTagsAndSort:
    runCorrection: true
    dontCorrectTagsTypes:
      - Cell
      - Molecule
    parameters:
      correctionPower: 0.001
      backgroundSubstitutionRate: 0.001
      backgroundIndelRate: 1.0e-05
      minQuality: 12
      maxSubstitutions: 2
      maxIndels: 2
      maxTotalErrors: 3
      postFilter:
        type: filter_and
        operands:
          - type: filter_groups
            groupingKeys:
              - allTags:Cell
            predicates:
              - metrics:
                  - type: "group_metric_nunique"
                    reportHist:
                      log: true
                      binNumber: 0
                      minBinWidth: 0.2
                    keys:
                      - allTags:Molecule
                operator:
                  type: group_operator_advanced_thresholding
                  algo:
                    type: otsu
                  histTransformers:
                    # Artificially adds 15% of singletons to the histogram before auto-thresholding algorithm
                    - type: inflate
                      fraction: 0.15
                  logX: true
                  minimalSample: 20
                  fallbackThreshold: 1.0
          - type: filter_groups
            groupingKeys:
              - allTags:Cell
              - allTags:Molecule
            predicates:
              - metrics:
                  - type: group_metric_kmer_diversity
                    sequences:
                      - targets
                    k: 12
                    minimalQuality: 20
                    topShare: 0.5
                    minSequenceCount: 4
                    reportHist:
                      binNumber: 0
                      minBinWidth: 6
                operator:
                  type: group_operator_range
                  lower: 150.0
                  acceptNaN: true
  assemble:
    inheritFrom: assemble-with-consensus-sc-cell-level-fr
    overrides:
      clnaOutput: true
      cloneAssemblerParameters:
        assemblingFeatures:
          - CDR3
        badQualityThreshold: 0
        minimalQuality: 0
        postFilters:
          - type: filter_in_groups
            isolationKeys:
              - clone
            nestedFilter:
              type: filter_groups
              groupingKeys:
                - allTags:Cell
              predicates:
                - metrics:
                    - type: group_metric_sum_weight
                      reportHist:
                        log: true
                        binNumber: 0
                        minBinWidth: 0.1
                  operator:
                    type: group_operator_cumtop
                    share: 0.99
            aggregateReport: true
  assembleContigs:
    inheritFrom: assembleContigs-sc-fr
    overrides:
      parameters:
        useOnlyFullAlignments:
          cumtop: 0.95
          fallbackToTopAlignment: true

    
"10x-ont-visium-hd-3gex":
  vendor: "10x Genomics"
  label: "Visium HD Oxford Nanopore XCR"
  category: non-generic
  flags:
    - species
  inheritFrom: bundle-base
  pipeline:
    - align
    - refineTagsAndSort
    - assemble
    - assembleContigs
    - exportClones
  mixins:
    - type: SetTagPattern
      tagPattern: ^*ctcttccgatctN{0:5}(UMI:N{9})N{0:3}(CELL1:gN{13:14}g)(CELL2:N{13:14}g)N{0:5}T{7:}(R1:*)
    - type: MaterialTypeRNA
    - type: SetContigAssemblingFeatures
      features: VDJRegion
  align:
    inheritFrom: align-long-read
    overrides:
      tagUnstranded: true
      tagTransformationSteps:
        - type: mapTags
          name: "Visium HD BC1 to column index"
          matchTags:
